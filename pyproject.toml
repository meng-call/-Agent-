[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-agent"
version = "0.1.0"
description = "AI-powered contract risk control review system with multi-agent workflow and RAG knowledge base"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Contract Review Team"}]
dependencies = [
    # --- API Layer ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # --- Config & Validation ---
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # --- Agent & LLM ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    # --- Vector Database ---
    "pymilvus>=2.4.0",
    # --- Embedding ---
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # --- Relational Database ---
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    # --- Document Parsing ---
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "docling>=2.0.0",
    # --- Logging & Monitoring ---
    "structlog>=24.0.0",
    # --- CLI ---
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
frontend = [
    "streamlit>=1.38.0",
]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "rag*", "db*", "tools*", "llm*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
