# ============================================
# Agent 配置
# ============================================
agent:
  max_turns: 10
  parallel_review: true
  session_timeout: 300

# ============================================
# RAG 检索配置
# ============================================
rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  score_threshold: 0.7

# ============================================
# 审查配置
# ============================================
review:
  risk_levels: [P0, P1, P2]
  output_format: json
  max_contract_length: 50000

# ============================================
# 日志配置
# ============================================
logging:
  level: INFO
  format: json
  output: [stdout, file]
