# 合约风控审查 Agent 系统 — Alembic 配置
# 用法:
#   alembic revision --autogenerate -m "init"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
# 迁移脚本目录
script_location = alembic
# 使用异步 SQLAlchemy
prepend_sys_path = .
# 日志级别
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
