# ============================================
# 合约风控审查 Agent 系统 — Docker Compose
# ============================================
# 启动全部服务: docker compose up -d
# 仅启动 MySQL:  docker compose up -d mysql
# 查看日志:      docker compose logs -f app
# 停止:          docker compose down

version: "3.9"

services:
  # ── FastAPI 应用 ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contract-review-app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 容器内覆盖：MySQL 主机指向 compose 服务名
      - MYSQL_HOST=mysql
      - MILVUS_DB_URI=./milvus_data.db
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=${PORT:-8000}
    volumes:
      # 持久化 Milvus Lite 向量数据
      - milvus_data:/app/milvus_data.db
      # 挂载法律数据（可选）
      - ./data:/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── MySQL 8.0 ────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: contract-review-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contract_review}
      MYSQL_USER: ${MYSQL_USER:-contract_review}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contract_review_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

# ── 持久卷 ──────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  milvus_data:
    driver: local
